<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Radio Mágica</title>
<style>
  :root { --bg: #0b0716; --fg: #f6eefe; --accent: #ff6fae; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "DejaVu Sans", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { width: min(100vw - 32px, 1280px); aspect-ratio: 16 / 9; border-radius: 14px;
    box-shadow: 0 10px 50px rgba(255, 111, 174, .25); background: #000; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
  body.capture { display: block; background: #000; }
  body.capture canvas { width: 1280px; height: 720px; border-radius: 0; box-shadow: none; }
  body.capture button { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<button id="replay">▶ Reproducir de nuevo</button>
<script>
"use strict";
const W = 1280, H = 720, DURATION = 10;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = '"DejaVu Sans", "Liberation Sans", sans-serif';

/* ---------- utilidades ---------- */
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const TAU = Math.PI * 2;
const BPM = 128, BEAT = 60 / BPM;
const INK = "#3a1b33";

function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, k));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, k));
  const bl = Math.round(lerp(pa & 255, pb & 255, k));
  return `rgb(${r},${g},${bl})`;
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillStroke(fill, lw = 3, stroke = INK) {
  ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = "round"; ctx.stroke(); }
}
function star4(x, y, r, rot = 0, color = "#fff") {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4;
    ctx.quadraticCurveTo(0, 0, Math.cos(a) * r, Math.sin(a) * r);
    ctx.quadraticCurveTo(0, 0, Math.cos(a + TAU / 8) * r * .18, Math.sin(a + TAU / 8) * r * .18);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function star5(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  ctx.closePath();
}
function note(x, y, s, rot, color, double) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 3.2;
  ellipse(-8, 10, 8, 6, -.4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-1.5, 9); ctx.lineTo(-1.5, -22); ctx.stroke();
  if (double) {
    ellipse(18, 5, 8, 6, -.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24.5, 4); ctx.lineTo(24.5, -27); ctx.stroke();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-1.5, -20); ctx.lineTo(24.5, -25); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-1.5, -22); ctx.quadraticCurveTo(14, -12, 8, 0); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- datos pre-calculados (deterministas) ---------- */
const R = rng(20251105);
const STARS = Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * H * .8, r: R() * 1.8 + .4, p: R() * TAU, s: R() * 3 + 1 }));
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: R() * W * 1.4 - 100, y: 430 + R() * 260, s: .6 + R() * .9, v: 8 + R() * 18, d: i % 2 }));
const NOTE_COLORS = ["#ff5fa2", "#ffd84d", "#5ee6d8", "#b48bff", "#ff9b54", "#7dff9b"];
const PARTS = Array.from({ length: 90 }, (_, i) => ({
  b: 1.9 + i * .085, a: -Math.PI / 2 + (R() - .5) * 2.6, v: 160 + R() * 180, rot: (R() - .5) * 1.2,
  sp: (R() - .5) * 3, kind: R() < .62 ? "note" : (R() < .5 ? "heart" : "star"),
  c: NOTE_COLORS[i % NOTE_COLORS.length], dbl: R() < .4, sz: .8 + R() * .7, wob: R() * TAU,
}));
const CONFETTI = Array.from({ length: 140 }, () => ({
  x: R() * W, vy: 120 + R() * 220, vx: (R() - .5) * 120, r: R() * TAU, vr: (R() - .5) * 10,
  c: NOTE_COLORS[Math.floor(R() * NOTE_COLORS.length)], w: 6 + R() * 8, h: 3 + R() * 5, d: R() * .6,
}));
const SPARKS = Array.from({ length: 40 }, () => ({ a: R() * TAU, d: 120 + R() * 260, s: 6 + R() * 16, p: R() * TAU }));

/* ---------- fondo ---------- */
function drawSky(t, magic) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex("#070420", "#2b0f5e", magic));
  g.addColorStop(.55, mixHex("#1c0f48", "#8a2f9e", magic));
  g.addColorStop(1, mixHex("#3a1d63", "#ff8fc0", magic));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of STARS) {
    const tw = .45 + .55 * Math.sin(t * s.s + s.p);
    ctx.globalAlpha = clamp(tw) * (1 - magic * .35);
    ctx.fillStyle = "#fff"; ellipse(s.x, s.y, s.r, s.r); ctx.fill();
    if (s.r > 1.9) star4(s.x, s.y, s.r * 4 * tw, 0, "#fff");
  }
  ctx.globalAlpha = 1;

  // luna
  const mx = 1060, my = 130;
  const mg = ctx.createRadialGradient(mx, my, 20, mx, my, 160);
  mg.addColorStop(0, "rgba(255,240,200,.55)"); mg.addColorStop(1, "rgba(255,240,200,0)");
  ctx.fillStyle = mg; ctx.fillRect(mx - 170, my - 170, 340, 340);
  ellipse(mx, my, 52, 52); ctx.fillStyle = "#fff4d6"; ctx.fill();
  ellipse(mx + 22, my - 12, 46, 46); ctx.fillStyle = mixHex("#120a35", "#3a1470", magic); ctx.fill();
}

function cloud(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.arc(-60, 10, 38, 0, TAU); ctx.arc(-15, -12, 52, 0, TAU); ctx.arc(45, 0, 42, 0, TAU); ctx.arc(85, 18, 28, 0, TAU);
  ctx.arc(-40, 32, 34, 0, TAU); ctx.arc(20, 34, 40, 0, TAU); ctx.arc(72, 34, 28, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function drawClouds(t, magic) {
  for (const c of CLOUDS) {
    const x = ((c.x + t * c.v) % (W + 300)) - 150;
    ctx.globalAlpha = .55;
    cloud(x, c.y, c.s, c.d ? mixHex("#4b2a86", "#ffc1e0", magic) : mixHex("#35206e", "#e59be0", magic));
  }
  ctx.globalAlpha = 1;
}

function sunburst(cx, cy, t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .35); ctx.globalAlpha = alpha;
  const n = 20;
  for (let i = 0; i < n; i++) {
    const a0 = i * TAU / n, a1 = a0 + TAU / n / 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1400, a0, a1); ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 900);
    g.addColorStop(0, i % 4 ? "rgba(255,236,160,.55)" : "rgba(255,160,220,.6)");
    g.addColorStop(1, "rgba(255,200,240,0)");
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

function speedLines(cx, cy, t, strength) {
  if (strength <= 0) return;
  const r = rng(Math.floor(t * 20) + 7);
  ctx.save(); ctx.globalAlpha = strength;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 70; i++) {
    const a = r() * TAU, w = .004 + r() * .012, inner = 260 + r() * 200;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a - w) * 1100, cy + Math.sin(a - w) * 1100);
    ctx.lineTo(cx + Math.cos(a + w) * 1100, cy + Math.sin(a + w) * 1100);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function soundRings(x, y, t, start, alpha) {
  if (alpha <= 0 || t < start) return;
  ctx.save(); ctx.lineCap = "round";
  for (let k = 0; k < 6; k++) {
    const age = ((t - start) / (BEAT * 2) + k / 6) % 1;
    const rad = 50 + age * 520;
    ctx.globalAlpha = alpha * (1 - age) * .8;
    ctx.strokeStyle = `hsl(${(k * 60 + t * 90) % 360},95%,72%)`;
    ctx.lineWidth = 10 * (1 - age) + 2;
    ctx.beginPath(); ctx.arc(x, y, rad, -Math.PI * .95, -Math.PI * .05); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

function particles(ox, oy, t, until) {
  for (const p of PARTS) {
    const age = t - p.b; const life = 2.6;
    if (age < 0 || age > life || p.b > until) continue;
    const k = age / life;
    const x = ox + Math.cos(p.a) * p.v * age + Math.sin(age * 3 + p.wob) * 18;
    const y = oy + Math.sin(p.a) * p.v * age - 40 * age * age;
    const s = p.sz * easeBack(seg(age, 0, .35)) * (1 - seg(k, .75, 1));
    if (s <= 0) continue;
    ctx.save(); ctx.globalAlpha = 1 - seg(k, .7, 1);
    if (p.kind === "note") {
      ctx.shadowColor = p.c; ctx.shadowBlur = 14;
      note(x, y, s * 1.2, p.rot + Math.sin(age * 4) * .3, p.c, p.dbl);
    } else if (p.kind === "heart") {
      ctx.translate(x, y); ctx.rotate(p.rot + age * p.sp * .3);
      ctx.shadowColor = "#ff5fa2"; ctx.shadowBlur = 12;
      heart(0, 0, 16 * s); ctx.fillStyle = "#ff5fa2"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)"; ellipse(-6 * s, -6 * s, 3 * s, 2 * s, -.6); ctx.fill();
    } else {
      ctx.shadowColor = "#fff6a8"; ctx.shadowBlur = 16;
      star4(x, y, 18 * s, age * p.sp, "#fff6c8");
    }
    ctx.restore();
  }
}

/* ---------- la radio mágica ---------- */
function radio(t, power, beatPulse) {
  // centrada en (0,0), ~ 190 x 124
  // asa
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-58, -58); ctx.bezierCurveTo(-58, -100, 58, -100, 58, -58);
  ctx.lineWidth = 16; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = 10; ctx.strokeStyle = "#ff8cc2"; ctx.stroke();

  // antena
  const ax = 118, ay = -150;
  ctx.beginPath(); ctx.moveTo(62, -52); ctx.lineTo(ax, ay);
  ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = 3.5; ctx.strokeStyle = "#d9dcf2"; ctx.stroke();

  // cuerpo
  roundRect(-96, -62, 192, 124, 26);
  const g = ctx.createLinearGradient(0, -62, 0, 62);
  g.addColorStop(0, "#6ff2e6"); g.addColorStop(.62, "#2fc6c0"); g.addColorStop(1, "#1a9aa6");
  fillStroke(g, 4.5);
  // franja inferior
  ctx.save(); roundRect(-96, -62, 192, 124, 26); ctx.clip();
  ctx.fillStyle = "#ff6fae"; ctx.fillRect(-100, 36, 200, 30);
  ctx.fillStyle = "rgba(255,255,255,.35)"; roundRect(-84, -54, 150, 14, 7); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-96, 36); ctx.lineTo(96, 36); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  for (let i = -3; i <= 3; i++) { star5(i * 26, 49, 5); ctx.fillStyle = "#ffe36e"; ctx.fill(); }

  // altavoz
  const sp = 1 + beatPulse * .09 * power;
  ctx.save(); ctx.translate(-42, -4); ctx.scale(sp, sp);
  ellipse(0, 0, 34, 34); fillStroke("#2a1740", 3.5);
  for (let r = 28; r > 4; r -= 7) {
    ellipse(0, 0, r, r); ctx.lineWidth = 2.5;
    ctx.strokeStyle = power > .1 ? `hsla(${(r * 12 + t * 200) % 360},90%,70%,${.35 + .6 * power})` : "#553a70";
    ctx.stroke();
  }
  ellipse(0, 0, 7, 7); ctx.fillStyle = power > .1 ? "#fff6c8" : "#553a70"; ctx.fill();
  ctx.restore();

  // dial
  roundRect(10, -40, 70, 28, 8);
  const dg = ctx.createLinearGradient(10, 0, 80, 0);
  dg.addColorStop(0, mixHex("#4c3d2a", "#ffd65c", power)); dg.addColorStop(1, mixHex("#3f3325", "#ffb13d", power));
  if (power > .1) { ctx.shadowColor = "#ffd84d"; ctx.shadowBlur = 25 * power; }
  fillStroke(dg, 3.5); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(58,27,51,.55)"; ctx.lineWidth = 1.5;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(16 + i * 7.3, -34); ctx.lineTo(16 + i * 7.3, -34 + (i % 2 ? 6 : 10)); ctx.stroke(); }
  const needle = 20 + (Math.sin(t * 1.3) * .5 + .5) * 50 * power + (1 - power) * 8;
  ctx.beginPath(); ctx.moveTo(needle, -38); ctx.lineTo(needle, -14); ctx.lineWidth = 3; ctx.strokeStyle = "#e0245e"; ctx.stroke();

  // perillas
  for (const [kx, rot] of [[28, t * 2 * power], [62, -t * 1.4 * power]]) {
    ellipse(kx, 14, 13, 13); fillStroke("#ffe36e", 3.5);
    ctx.beginPath(); ctx.moveTo(kx, 14); ctx.lineTo(kx + Math.cos(rot - 1.3) * 10, 14 + Math.sin(rot - 1.3) * 10);
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  }

  // estrella en la antena
  const glow = .35 + .65 * power;
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(t * 1.5);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 70 * glow + beatPulse * 20 * power);
  sg.addColorStop(0, `rgba(255,245,170,${.8 * glow})`); sg.addColorStop(1, "rgba(255,245,170,0)");
  ctx.fillStyle = sg; ctx.fillRect(-100, -100, 200, 200);
  const ss = 1 + beatPulse * .18 * power;
  star5(0, 0, 20 * ss); fillStroke(mixHex("#b39a52", "#ffe14d", power), 3.5);
  ctx.restore();
  if (power > .2) {
    star4(ax + Math.cos(t * 3) * 38, ay + Math.sin(t * 3) * 38, 11 * power, t, "#fff");
    star4(ax + Math.cos(t * 3 + 2.5) * 44, ay + Math.sin(t * 3 + 2.5) * 44, 8 * power, -t, "#fff");
  }
}

/* ---------- la chica (estilo anime) ---------- */
const SKIN = "#ffe3d2", SKIN_SH = "#f7bca6";
const HAIR = "#d79a55", HAIR_SH = "#a86a36", HAIR_HI = "#f7d08e";

function hairGradient(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#c98a4a"); g.addColorStop(.35, HAIR); g.addColorStop(1, "#f0b872");
  return g;
}

function backHair(sw) {
  ctx.beginPath();
  ctx.moveTo(-80, -20);
  ctx.bezierCurveTo(-112, 60, -104, 160, -132 + sw * 14, 262);
  ctx.quadraticCurveTo(-112 + sw * 16, 286, -92 + sw * 16, 262);
  ctx.quadraticCurveTo(-72 + sw * 18, 296, -48 + sw * 18, 270);
  ctx.quadraticCurveTo(-20 + sw * 18, 300, 0 + sw * 18, 272);
  ctx.quadraticCurveTo(24 + sw * 18, 300, 48 + sw * 18, 270);
  ctx.quadraticCurveTo(74 + sw * 18, 296, 92 + sw * 16, 262);
  ctx.quadraticCurveTo(114 + sw * 16, 286, 132 + sw * 14, 262);
  ctx.bezierCurveTo(104, 160, 112, 60, 80, -20);
  ctx.arc(0, -20, 80, 0, Math.PI, true);
  ctx.closePath();
  fillStroke(hairGradient(-100, 290), 3.5);
  // mechones interiores (sombra)
  ctx.strokeStyle = HAIR_SH; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (const s of [-1, 1]) {
    for (const [a, b, c] of [[70, 120, 230], [52, 140, 250], [92, 90, 200]]) {
      ctx.beginPath(); ctx.moveTo(s * a, b - 60); ctx.quadraticCurveTo(s * (a + 22), b + 40, s * (a + 14) + sw * 14, c); ctx.stroke();
    }
  }
}

function body(t, sw) {
  // cuello
  roundRect(-15, 55, 30, 50, 8); fillStroke(SKIN, 3);
  ctx.save(); roundRect(-15, 55, 30, 50, 8); ctx.clip(); ctx.fillStyle = SKIN_SH; ctx.fillRect(-20, 55, 40, 22); ctx.restore();

  // vestido
  ctx.beginPath();
  ctx.moveTo(-46, 100);
  ctx.quadraticCurveTo(0, 90, 46, 100);
  ctx.bezierCurveTo(70, 180, 110, 260, 150 + sw * 6, 350);
  for (let i = 0; i <= 10; i++) {
    const x = lerp(150, -150, i / 10) + sw * 6;
    ctx.quadraticCurveTo(x + 15, 372, x, 352);
  }
  ctx.bezierCurveTo(-110, 260, -70, 180, -46, 100);
  ctx.closePath();
  const dg = ctx.createLinearGradient(0, 90, 0, 360);
  dg.addColorStop(0, "#ff82bb"); dg.addColorStop(1, "#ff4f9a");
  fillStroke(dg, 3.5);
  // estrellitas y lunares del vestido
  ctx.save(); ctx.clip();
  const r = rng(99);
  for (let i = 0; i < 26; i++) {
    const x = (r() - .5) * 280, y = 120 + r() * 240;
    if (i % 3 === 0) { star5(x, y, 7, r()); ctx.fillStyle = "#ffe36e"; ctx.fill(); }
    else { ellipse(x, y, 4, 4); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fill(); }
  }
  ctx.fillStyle = "rgba(160,20,90,.18)";
  ctx.beginPath(); ctx.moveTo(30, 95); ctx.bezierCurveTo(70, 180, 110, 260, 160, 360); ctx.lineTo(60, 360); ctx.bezierCurveTo(60, 250, 40, 170, 20, 95); ctx.fill();
  ctx.restore();

  // cuello tipo Peter Pan
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, 98);
    ctx.quadraticCurveTo(s * 10, 128, s * 34, 122);
    ctx.quadraticCurveTo(s * 50, 112, s * 42, 98);
    ctx.quadraticCurveTo(s * 20, 94, 0, 98);
    fillStroke("#ffffff", 3);
  }
  // lazo turquesa del cuello
  ctx.save(); ctx.translate(0, 110);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * 20, -16, s * 24, 0); ctx.quadraticCurveTo(s * 20, 16, 0, 0);
    fillStroke("#35d0c8", 3);
  }
  ellipse(0, 0, 6, 6); fillStroke("#2ab0aa", 2.5);
  ctx.restore();
}

function arm(side, sw, handX, handY) {
  // brazo: del hombro a la mano, con codo
  const sx = side * 62, sy = 118, ex = side * 96, ey = 178 + sw * side * 4;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(ex, ey, handX, handY);
  ctx.lineWidth = 26; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = 20; ctx.strokeStyle = SKIN; ctx.stroke();
  // manga abullonada
  ellipse(side * 60, 116, 32, 26, side * .5);
  const g = ctx.createRadialGradient(side * 54, 108, 4, side * 60, 116, 34);
  g.addColorStop(0, "#ffb3d6"); g.addColorStop(1, "#ff5fa2");
  fillStroke(g, 3.5);
  ctx.beginPath(); ctx.moveTo(side * 42, 134); ctx.quadraticCurveTo(side * 64, 146, side * 86, 128);
  ctx.lineWidth = 5; ctx.strokeStyle = "#ffffff"; ctx.stroke();
}
function hand(x, y, side) {
  ellipse(x, y, 17, 14, side * .6); fillStroke(SKIN, 3);
  ctx.beginPath(); ctx.moveTo(x - side * 6, y - 6); ctx.lineTo(x - side * 1, y + 4); ctx.lineWidth = 2; ctx.strokeStyle = SKIN_SH; ctx.stroke();
}

function face() {
  ctx.beginPath();
  ctx.moveTo(-64, -12);
  ctx.bezierCurveTo(-64, 34, -26, 70, 0, 80);
  ctx.bezierCurveTo(26, 70, 64, 34, 64, -12);
  ctx.bezierCurveTo(64, -86, -64, -86, -64, -12);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -60, 0, 80);
  g.addColorStop(0, "#ffd9c4"); g.addColorStop(.4, SKIN); g.addColorStop(1, "#ffeadf");
  fillStroke(g, 3.5);
  // sombra de flequillo (cel shading)
  ctx.save(); ctx.clip();
  ctx.fillStyle = "rgba(240,160,140,.55)";
  ctx.beginPath(); ctx.moveTo(-70, -30);
  for (let i = 0; i <= 12; i++) ctx.lineTo(-70 + i * 11.7, (i % 2 ? -4 : -18) + 6);
  ctx.lineTo(70, -90); ctx.lineTo(-70, -90); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function eye(x, side, open, t, wink) {
  const cy = 24;
  ctx.save(); ctx.translate(x, cy); ctx.scale(.84, .84);
  if (wink) {
    // guiño ^
    ctx.beginPath(); ctx.moveTo(-22, 6); ctx.quadraticCurveTo(0, -18, 22, 6);
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(side * 20, 2); ctx.lineTo(side * 30, -6); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore(); return;
  }
  if (open < .12) {
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.quadraticCurveTo(0, 12, 22, 2);
    ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore(); return;
  }
  ctx.scale(1, open);
  // esclerótica
  ctx.beginPath(); ctx.moveTo(-23, -6); ctx.bezierCurveTo(-22, -26, 22, -30, 24, -8);
  ctx.bezierCurveTo(24, 16, 12, 26, 0, 26); ctx.bezierCurveTo(-14, 26, -24, 14, -23, -6); ctx.closePath();
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.save(); ctx.clip();
  // iris
  ellipse(side * 1.5, 4, 17, 24);
  const ig = ctx.createLinearGradient(0, -22, 0, 28);
  ig.addColorStop(0, "#3b1a0c"); ig.addColorStop(.45, "#8a4a1c"); ig.addColorStop(1, "#f2b24e");
  ctx.fillStyle = ig; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#2a1208"; ctx.stroke();
  // brillo inferior del iris
  ellipse(side * 1.5, 16, 11, 7); ctx.fillStyle = "rgba(255,220,130,.6)"; ctx.fill();
  // pupila
  ellipse(side * 1.5, 4, 7, 11); ctx.fillStyle = "#1c0a05"; ctx.fill();
  // sombra superior del párpado
  ctx.fillStyle = "rgba(90,40,70,.28)"; ctx.fillRect(-30, -30, 60, 14);
  // reflejos
  ctx.fillStyle = "#fff";
  ellipse(side * -6 + 2, -6, 6.5, 8.5, -.3); ctx.fill();
  ellipse(side * 8, 14, 3.2, 3.2); ctx.fill();
  star4(side * 7, -10, 5 + Math.sin(t * 6) * 1.5, t, "#fff");
  ctx.restore();
  // pestañas superiores
  ctx.beginPath(); ctx.moveTo(-side * 24, -4); ctx.bezierCurveTo(-side * 22, -28, side * 20, -34, side * 28, -8);
  ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(side * 24, -14); ctx.quadraticCurveTo(side * 31, -16, side * 34, -22); ctx.lineWidth = 3.5; ctx.stroke();
  // pestaña inferior
  ctx.beginPath(); ctx.moveTo(-8, 27); ctx.quadraticCurveTo(4, 29, 14, 24); ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function mouth(open) {
  ctx.save(); ctx.translate(0, 8);
  if (open > .08) {
    const h = 6 + open * 14;
    ctx.beginPath(); ctx.moveTo(-11, 46); ctx.quadraticCurveTo(0, 44, 11, 46);
    ctx.quadraticCurveTo(9, 46 + h, 0, 46 + h); ctx.quadraticCurveTo(-9, 46 + h, -11, 46); ctx.closePath();
    fillStroke("#b5244e", 2.5);
    ctx.save(); ctx.clip(); ellipse(0, 46 + h, 8, 6); ctx.fillStyle = "#ff7d9c"; ctx.fill(); ctx.restore();
  } else {
    ctx.beginPath(); ctx.moveTo(-9, 47); ctx.quadraticCurveTo(0, 55, 9, 47);
    ctx.lineWidth = 2.8; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
  }
  ctx.restore();
}

function bangs(sw) {
  ctx.beginPath();
  ctx.moveTo(-86, 24);
  ctx.bezierCurveTo(-98, -62, -52, -104, 0, -104);
  ctx.bezierCurveTo(52, -104, 98, -62, 86, 24);
  const pts = [[74, -4], [64, -34], [54, -2], [42, -40], [30, -8], [16, -44], [4, -12], [-10, -44], [-22, -10], [-36, -40], [-48, -4], [-60, -34], [-72, 2]];
  let px = 86, py = 24;
  for (const [x, y] of pts) {
    const xx = x + sw * 2;
    const down = y > py;
    ctx.quadraticCurveTo(down ? px * .25 + xx * .75 : px * .75 + xx * .25, down ? py * .8 + y * .2 : py * .2 + y * .8, xx, y);
    px = xx; py = y;
  }
  ctx.quadraticCurveTo(-80, 10, -86, 24);
  ctx.closePath();
  fillStroke(hairGradient(-104, 20), 3.5);
  // mechones laterales largos
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 82, -30);
    ctx.quadraticCurveTo(s * 104, 60, s * 92 + sw * 8, 150);
    ctx.quadraticCurveTo(s * 86 + sw * 5, 100, s * 74, 56);
    ctx.quadraticCurveTo(s * 78, 16, s * 70, -10);
    ctx.closePath();
    fillStroke(hairGradient(-30, 150), 3);
  }
  // anillo de brillo (angel ring)
  ctx.strokeStyle = HAIR_HI; ctx.lineWidth = 7; ctx.lineCap = "round";
  for (const [a0, a1] of [[-2.6, -2.25], [-2.1, -1.75], [-1.6, -1.2], [-1.05, -.7]]) {
    ctx.beginPath(); ctx.arc(0, -8, 80, a0, a1); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ellipse(-30, -84, 6, 3, -.3); ctx.fill(); ellipse(24, -86, 5, 2.5, .3); ctx.fill();
}

function bow(t) {
  ctx.save(); ctx.translate(58, -88); ctx.rotate(.35 + Math.sin(t * 5) * .04);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(s * 30, -34, s * 56, -14, s * 48, 8);
    ctx.bezierCurveTo(s * 40, 26, s * 16, 14, 0, 0);
    const g = ctx.createLinearGradient(s * 50, -20, 0, 10);
    g.addColorStop(0, "#ff5fa2"); g.addColorStop(1, "#ffa3cf");
    fillStroke(g, 3);
    ctx.beginPath(); ctx.moveTo(s * 10, 2); ctx.quadraticCurveTo(s * 28, -6, s * 38, 4); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(160,20,90,.5)"; ctx.stroke();
  }
  star5(0, 2, 13, 0); fillStroke("#ffe14d", 3);
  ctx.restore();
}

function girl(t, s) {
  // s: {sway, bob, blink, mouth, wink, radioPower, beatPulse, tilt}
  ctx.save();
  ctx.translate(0, -s.bob);
  backHair(s.sway);
  body(t, s.sway);
  // cabeza con ligera inclinación
  ctx.save(); ctx.translate(0, 20); ctx.rotate(s.tilt); ctx.translate(0, -20);
  face();
  // rubor
  for (const side of [-1, 1]) {
    const bg = ctx.createRadialGradient(side * 42, 46, 1, side * 42, 46, 18);
    bg.addColorStop(0, "rgba(255,110,150,.55)"); bg.addColorStop(1, "rgba(255,110,150,0)");
    ctx.fillStyle = bg; ellipse(side * 42, 46, 20, 12); ctx.fill();
    ctx.strokeStyle = "rgba(230,70,110,.55)"; ctx.lineWidth = 1.8;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(side * 36 + i * 6 - 4, 48); ctx.lineTo(side * 36 + i * 6, 41); ctx.stroke(); }
  }
  eye(-31, -1, s.blink, t, false);
  eye(31, 1, s.blink, t, s.wink);
  ctx.beginPath(); ctx.moveTo(2, 40); ctx.lineTo(-1, 44); ctx.lineWidth = 2; ctx.strokeStyle = "#d98c78"; ctx.lineCap = "round"; ctx.stroke();
  mouth(s.mouth);
  bangs(s.sway);
  bow(t);
  ctx.restore();

  // brazos + radio
  const ry = 198;
  arm(-1, s.sway, -84, ry + 10);
  arm(1, s.sway, 84, ry + 10);
  ctx.save(); ctx.translate(0, ry); ctx.scale(.9, .9);
  radio(t, s.radioPower, s.beatPulse);
  ctx.restore();
  hand(-84, ry + 12, -1);
  hand(84, ry + 12, 1);
  ctx.restore();
}

/* ---------- título ---------- */
function title(t) {
  const k = seg(t, 8.0, 8.6);
  if (k <= 0) return;
  const sc = easeBack(k);
  ctx.save(); ctx.translate(W / 2, 590); ctx.scale(sc, sc);
  // cinta
  ctx.beginPath(); ctx.moveTo(-430, -62); ctx.quadraticCurveTo(0, -92, 430, -62);
  ctx.lineTo(450, 70); ctx.quadraticCurveTo(0, 40, -450, 70); ctx.closePath();
  const rg = ctx.createLinearGradient(-450, 0, 450, 0);
  rg.addColorStop(0, "#7a3cff"); rg.addColorStop(.5, "#ff4f9a"); rg.addColorStop(1, "#ff9b54");
  ctx.globalAlpha = .92; fillStroke(rg, 5, "#2a0f3a"); ctx.globalAlpha = 1;

  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const lines = [["Luli Pampín", `bold 64px ${FONT}`, -18], ["y la Radio Mágica", `bold 34px ${FONT}`, 38]];
  for (const [txt, f, y] of lines) {
    ctx.font = f;
    ctx.lineWidth = 12; ctx.strokeStyle = "#2a0f3a"; ctx.strokeText(txt, 0, y);
    const tg = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    tg.addColorStop(0, "#fffbe0"); tg.addColorStop(.55, "#ffe14d"); tg.addColorStop(1, "#ffb13d");
    ctx.fillStyle = tg; ctx.fillText(txt, 0, y);
  }
  // barrido de brillo
  const sh = seg(t, 8.7, 9.5);
  if (sh > 0 && sh < 1) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-430, -62); ctx.quadraticCurveTo(0, -92, 430, -62);
    ctx.lineTo(450, 70); ctx.quadraticCurveTo(0, 40, -450, 70); ctx.closePath(); ctx.clip();
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .45;
    const x = lerp(-420, 420, sh);
    const shg = ctx.createLinearGradient(x - 60, 0, x + 60, 0);
    shg.addColorStop(0, "rgba(255,255,255,0)"); shg.addColorStop(.5, "rgba(255,255,255,.9)"); shg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = shg; ctx.fillRect(-450, -90, 900, 170);
    ctx.restore();
  }
  star4(-400 + Math.sin(t * 4) * 6, -70, 22 * (0.7 + .3 * Math.sin(t * 7)), t, "#fff");
  star4(410, 40, 18 * (0.7 + .3 * Math.cos(t * 6)), -t, "#fff");
  ctx.restore();
}

/* ---------- escena completa ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over";

  const beatPhase = (t / BEAT) % 1;
  const beatPulse = Math.pow(1 - beatPhase, 3);
  const magic = easeInOut(seg(t, 1.6, 4.2));
  const shake = seg(t, 2.8, 3.55) * (1 - seg(t, 3.55, 3.7));
  const sx = shake ? (Math.sin(t * 90) * 6 * shake) : 0, sy = shake ? (Math.cos(t * 77) * 5 * shake) : 0;

  // cámara
  const zoom = t < 3.6 ? lerp(1.0, 1.18, easeInOut(seg(t, 0, 3.5)))
             : t < 8 ? lerp(1.12, 1.0, easeOut(seg(t, 3.6, 5))) + .04 * easeInOut(seg(t, 5, 8))
             : lerp(1.04, .96, easeInOut(seg(t, 8, 10)));
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);

  drawSky(t, magic);
  sunburst(W / 2, 330, t, .55 * easeOut(seg(t, 3.6, 4.6)));
  drawClouds(t, magic);

  const phaseRadio = t < 3.62;
  if (phaseRadio) {
    // escena 1: la radio sobre una nube, despertando
    const rx = W / 2, ry = 420 + Math.sin(t * 2) * 6;
    const power = easeOut(seg(t, 1.2, 2.4));
    // pedestal de nube mágica
    const pg = ctx.createRadialGradient(rx, ry + 90, 10, rx, ry + 90, 260);
    pg.addColorStop(0, `rgba(255,200,240,${.2 + .5 * power})`); pg.addColorStop(1, "rgba(255,200,240,0)");
    ctx.fillStyle = pg; ctx.fillRect(rx - 300, ry - 100, 600, 400);
    cloud(rx - 10, ry + 88, 1.35, mixHex("#5a3a9c", "#ffd6ee", power));
    soundRings(rx, ry, t, 1.9, power);
    speedLines(rx, ry, t, seg(t, 2.7, 3.5) * .85);
    particles(rx, ry - 30, t, 3.4);
    ctx.save(); ctx.translate(rx, ry); ctx.scale(1.55, 1.55); ctx.rotate(Math.sin(t * 1.6) * .04 + shake * Math.sin(t * 60) * .04);
    radio(t, power, beatPulse * seg(t, 1.9, 2.1));
    ctx.restore();
  } else {
    // escena 2: ¡aparece la chica con la radio!
    const cx = W / 2, cy = 232;
    const pop = easeBack(seg(t, 3.6, 4.15));
    const danceT = t - 3.6;
    const sway = Math.sin(danceT * Math.PI / BEAT / 2) * clamp(danceT * 2);
    const bob = Math.abs(Math.sin(danceT * Math.PI / BEAT)) * 10;
    const blinkT = [5.3, 6.55, 9.2].reduce((m, b) => Math.min(m, Math.abs(t - b)), 9);
    const blink = blinkT < .09 ? blinkT / .09 : 1;
    const wink = t > 7.35 && t < 7.95;
    const singing = t > 4.3 && t < 8.1 ? (Math.sin(t * TAU * 2.1) * .5 + .5) * (Math.sin(t * 5.1) > -.4 ? 1 : 0) : (t >= 8.1 ? .9 : 0);
    const radioScreen = { x: cx, y: cy + 198 * 1.2 - bob };

    soundRings(radioScreen.x, radioScreen.y, t, 3.6, 1);
    particles(radioScreen.x, radioScreen.y - 40, t, 9.5);

    ctx.save();
    ctx.translate(cx, cy + (1 - pop) * 80);
    ctx.scale(1.2 * pop, 1.2 * pop);
    ctx.rotate(sway * .045);
    girl(t, { sway, bob, blink, mouth: singing, wink, radioPower: 1, beatPulse, tilt: sway * .06 });
    ctx.restore();

    // chispa del guiño
    if (wink) {
      const wk = seg(t, 7.35, 7.95);
      const s = Math.sin(wk * Math.PI);
      const wx = cx + (29 + 40) * 1.2, wy = cy + 0;
      star4(wx, wy - 10, 40 * s, wk * 3, "#fff6a8");
      star4(wx + 36, wy - 44, 18 * s, -wk * 4, "#fff");
      heart(wx + 50, wy + 10, 14 * s); ctx.fillStyle = "#ff5fa2"; ctx.fill();
    }

    // destellos alrededor
    for (const sp of SPARKS) {
      const a = sp.a + t * .4, tw = Math.sin(t * 5 + sp.p);
      if (tw < 0) continue;
      star4(cx + Math.cos(a) * sp.d * 1.3, 330 + Math.sin(a) * sp.d * .9, sp.s * tw * seg(t, 3.8, 4.6), t, "#fff");
    }
  }

  // confeti final
  if (t > 8.0) {
    for (const c of CONFETTI) {
      const age = t - 8.0 - c.d; if (age < 0) continue;
      const x = c.x + c.vx * age + Math.sin(age * 3 + c.r) * 20, y = -20 + c.vy * age;
      ctx.save(); ctx.translate(x, y); ctx.rotate(c.r + c.vr * age); ctx.scale(1, Math.cos(age * 6 + c.r));
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }
  }
  title(t);

  // capas de pantalla (sin zoom)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // viñeta
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(10,0,30,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // destello de transformación
  const flash = t < 3.62 ? seg(t, 3.3, 3.62) : 1 - seg(t, 3.62, 4.1);
  if (flash > 0) { ctx.fillStyle = `rgba(255,248,235,${easeInOut(flash)})`; ctx.fillRect(0, 0, W, H); }
  // fundidos de entrada/salida
  const fade = Math.max(1 - seg(t, 0, .8), seg(t, 9.6, 10));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  // franjas de cine
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 18); ctx.fillRect(0, H - 18, W, 18);
}

/* ---------- reproducción ---------- */
window.renderAt = t => render(clamp(t, 0, DURATION - 1e-4));
let start = null, playing = false;
function loop(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000;
  render(Math.min(t, DURATION - 1e-4));
  if (t < DURATION) requestAnimationFrame(loop); else playing = false;
}
const music = new Audio("musica.wav");
function play() {
  if (playing) return; playing = true; start = null;
  try { music.currentTime = 0; music.play().catch(() => {}); } catch (e) {}
  requestAnimationFrame(loop);
}
document.getElementById("replay").addEventListener("click", play);
if (new URLSearchParams(location.search).has("capture")) { document.body.classList.add("capture"); render(0); }
else play();
</script>
</body>
