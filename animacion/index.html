<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Radio Mágica</title>
<style>
  :root { --bg: #0b0716; --fg: #f6eefe; --accent: #ff6fae; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "DejaVu Sans", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { width: min(100vw - 32px, 1280px); aspect-ratio: 16 / 9; border-radius: 14px;
    box-shadow: 0 10px 50px rgba(255, 111, 174, .25); background: #000; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
  body.capture { display: block; background: #000; }
  body.capture canvas { width: 1280px; height: 720px; border-radius: 0; box-shadow: none; }
  body.capture button { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<button id="replay">▶ Reproducir de nuevo</button>
<script>
"use strict";
const W = 1280, H = 720, DURATION = 10;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = '"DejaVu Sans", "Liberation Sans", sans-serif';

/* ---------- utilidades ---------- */
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const TAU = Math.PI * 2;
const BPM = 128, BEAT = 60 / BPM;
const INK = "#3a1b33";

function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, k));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, k));
  const bl = Math.round(lerp(pa & 255, pb & 255, k));
  return `rgb(${r},${g},${bl})`;
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillStroke(fill, lw = 3, stroke = INK) {
  ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = "round"; ctx.stroke(); }
}
function star4(x, y, r, rot = 0, color = "#fff") {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4;
    ctx.quadraticCurveTo(0, 0, Math.cos(a) * r, Math.sin(a) * r);
    ctx.quadraticCurveTo(0, 0, Math.cos(a + TAU / 8) * r * .18, Math.sin(a + TAU / 8) * r * .18);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function star5(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  ctx.closePath();
}
function note(x, y, s, rot, color, double) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 3.2;
  ellipse(-8, 10, 8, 6, -.4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-1.5, 9); ctx.lineTo(-1.5, -22); ctx.stroke();
  if (double) {
    ellipse(18, 5, 8, 6, -.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24.5, 4); ctx.lineTo(24.5, -27); ctx.stroke();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-1.5, -20); ctx.lineTo(24.5, -25); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-1.5, -22); ctx.quadraticCurveTo(14, -12, 8, 0); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- datos pre-calculados (deterministas) ---------- */
const R = rng(20251105);
const STARS = Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * H * .8, r: R() * 1.8 + .4, p: R() * TAU, s: R() * 3 + 1 }));
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: R() * W * 1.4 - 100, y: 430 + R() * 260, s: .6 + R() * .9, v: 8 + R() * 18, d: i % 2 }));
const NOTE_COLORS = ["#ff5fa2", "#ffd84d", "#5ee6d8", "#b48bff", "#ff9b54", "#7dff9b"];
const PARTS = Array.from({ length: 90 }, (_, i) => ({
  b: 1.9 + i * .085, a: -Math.PI / 2 + (R() - .5) * 2.6, v: 160 + R() * 180, rot: (R() - .5) * 1.2,
  sp: (R() - .5) * 3, kind: R() < .62 ? "note" : (R() < .5 ? "heart" : "star"),
  c: NOTE_COLORS[i % NOTE_COLORS.length], dbl: R() < .4, sz: .8 + R() * .7, wob: R() * TAU,
}));
const CONFETTI = Array.from({ length: 140 }, () => ({
  x: R() * W, vy: 120 + R() * 220, vx: (R() - .5) * 120, r: R() * TAU, vr: (R() - .5) * 10,
  c: NOTE_COLORS[Math.floor(R() * NOTE_COLORS.length)], w: 6 + R() * 8, h: 3 + R() * 5, d: R() * .6,
}));
const SPARKS = Array.from({ length: 40 }, () => ({ a: R() * TAU, d: 120 + R() * 260, s: 6 + R() * 16, p: R() * TAU }));

/* ---------- fondo ---------- */
function drawSky(t, magic) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex("#070420", "#2b0f5e", magic));
  g.addColorStop(.55, mixHex("#1c0f48", "#8a2f9e", magic));
  g.addColorStop(1, mixHex("#3a1d63", "#ff8fc0", magic));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of STARS) {
    const tw = .45 + .55 * Math.sin(t * s.s + s.p);
    ctx.globalAlpha = clamp(tw) * (1 - magic * .35);
    ctx.fillStyle = "#fff"; ellipse(s.x, s.y, s.r, s.r); ctx.fill();
    if (s.r > 1.9) star4(s.x, s.y, s.r * 4 * tw, 0, "#fff");
  }
  ctx.globalAlpha = 1;

  // luna
  const mx = 1060, my = 130;
  const mg = ctx.createRadialGradient(mx, my, 20, mx, my, 160);
  mg.addColorStop(0, "rgba(255,240,200,.55)"); mg.addColorStop(1, "rgba(255,240,200,0)");
  ctx.fillStyle = mg; ctx.fillRect(mx - 170, my - 170, 340, 340);
  ellipse(mx, my, 52, 52); ctx.fillStyle = "#fff4d6"; ctx.fill();
  ellipse(mx + 22, my - 12, 46, 46); ctx.fillStyle = mixHex("#120a35", "#3a1470", magic); ctx.fill();
}

function cloud(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.arc(-60, 10, 38, 0, TAU); ctx.arc(-15, -12, 52, 0, TAU); ctx.arc(45, 0, 42, 0, TAU); ctx.arc(85, 18, 28, 0, TAU);
  ctx.arc(-40, 32, 34, 0, TAU); ctx.arc(20, 34, 40, 0, TAU); ctx.arc(72, 34, 28, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function drawClouds(t, magic) {
  for (const c of CLOUDS) {
    const x = ((c.x + t * c.v) % (W + 300)) - 150;
    ctx.globalAlpha = .55;
    cloud(x, c.y, c.s, c.d ? mixHex("#4b2a86", "#ffc1e0", magic) : mixHex("#35206e", "#e59be0", magic));
  }
  ctx.globalAlpha = 1;
}

function sunburst(cx, cy, t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .35); ctx.globalAlpha = alpha;
  const n = 20;
  for (let i = 0; i < n; i++) {
    const a0 = i * TAU / n, a1 = a0 + TAU / n / 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1400, a0, a1); ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 900);
    g.addColorStop(0, i % 4 ? "rgba(255,236,160,.55)" : "rgba(255,160,220,.6)");
    g.addColorStop(1, "rgba(255,200,240,0)");
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

function speedLines(cx, cy, t, strength) {
  if (strength <= 0) return;
  const r = rng(Math.floor(t * 20) + 7);
  ctx.save(); ctx.globalAlpha = strength;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 70; i++) {
    const a = r() * TAU, w = .004 + r() * .012, inner = 260 + r() * 200;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a - w) * 1100, cy + Math.sin(a - w) * 1100);
    ctx.lineTo(cx + Math.cos(a + w) * 1100, cy + Math.sin(a + w) * 1100);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function soundRings(x, y, t, start, alpha) {
  if (alpha <= 0 || t < start) return;
  ctx.save(); ctx.lineCap = "round";
  for (let k = 0; k < 6; k++) {
    const age = ((t - start) / (BEAT * 2) + k / 6) % 1;
    const rad = 50 + age * 520;
    ctx.globalAlpha = alpha * (1 - age) * .8;
    ctx.strokeStyle = `hsl(${(k * 60 + t * 90) % 360},95%,72%)`;
    ctx.lineWidth = 10 * (1 - age) + 2;
    ctx.beginPath(); ctx.arc(x, y, rad, -Math.PI * .95, -Math.PI * .05); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

function particles(ox, oy, t, until) {
  for (const p of PARTS) {
    const age = t - p.b; const life = 2.6;
    if (age < 0 || age > life || p.b > until) continue;
    const k = age / life;
    const x = ox + Math.cos(p.a) * p.v * age + Math.sin(age * 3 + p.wob) * 18;
    const y = oy + Math.sin(p.a) * p.v * age - 40 * age * age;
    const s = p.sz * easeBack(seg(age, 0, .35)) * (1 - seg(k, .75, 1));
    if (s <= 0) continue;
    ctx.save(); ctx.globalAlpha = 1 - seg(k, .7, 1);
    if (p.kind === "note") {
      ctx.shadowColor = p.c; ctx.shadowBlur = 14;
      note(x, y, s * 1.2, p.rot + Math.sin(age * 4) * .3, p.c, p.dbl);
    } else if (p.kind === "heart") {
      ctx.translate(x, y); ctx.rotate(p.rot + age * p.sp * .3);
      ctx.shadowColor = "#ff5fa2"; ctx.shadowBlur = 12;
      heart(0, 0, 16 * s); ctx.fillStyle = "#ff5fa2"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)"; ellipse(-6 * s, -6 * s, 3 * s, 2 * s, -.6); ctx.fill();
    } else {
      ctx.shadowColor = "#fff6a8"; ctx.shadowBlur = 16;
      star4(x, y, 18 * s, age * p.sp, "#fff6c8");
    }
    ctx.restore();
  }
}

/* ---------- la Radio (personaje: radiocasete morado con cara) ---------- */
function radioChar(t, st) {
  // st: { eyes: 0 (dormida) .. 1 (abiertos), mouth: 0..1, look: -1..1, pulse: 0..1, glow: 0..1 }
  const eyes = st.eyes, look = st.look || 0;
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  // asa
  roundRect(-90, -134, 180, 66, 20);
  ctx.lineWidth = 18; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = 11; ctx.strokeStyle = "#6a3cb4"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70, -128); ctx.lineTo(70, -128); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.stroke();

  // pies
  for (const s of [-1, 1]) { roundRect(s * 84 - 24, 100, 48, 24, 9); fillStroke("#4b2a7c", 3.5); }

  // brillo mágico detrás
  if (st.glow > 0) {
    const gg = ctx.createRadialGradient(0, 0, 40, 0, 0, 260);
    gg.addColorStop(0, `rgba(210,160,255,${.55 * st.glow})`); gg.addColorStop(1, "rgba(210,160,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(-280, -280, 560, 560);
  }

  // cuerpo
  roundRect(-140, -86, 280, 196, 30);
  const bg = ctx.createLinearGradient(0, -86, 0, 110);
  bg.addColorStop(0, "#c39bf7"); bg.addColorStop(.45, "#9767e0"); bg.addColorStop(1, "#6d3bbf");
  fillStroke(bg, 5);
  ctx.save(); roundRect(-140, -86, 280, 196, 30); ctx.clip();
  // placa frontal y reflejos
  ctx.fillStyle = "rgba(255,255,255,.10)"; roundRect(-124, -70, 248, 166, 22); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; roundRect(-118, -80, 120, 10, 5); ctx.fill();
  ctx.fillStyle = "rgba(60,20,110,.25)"; ctx.fillRect(-150, 80, 300, 40);
  // purpurina
  const gr = rng(7);
  for (let i = 0; i < 40; i++) {
    const x = (gr() - .5) * 270, y = (gr() - .5) * 190, tw = .5 + .5 * Math.sin(t * 6 + i);
    ctx.fillStyle = `rgba(255,255,255,${.25 * tw})`; ellipse(x, y, 1.6, 1.6); ctx.fill();
  }
  ctx.restore();

  // botones superiores
  for (const [x, c] of [[-108, "#ff7cc4"], [-84, "#ffd84d"], [84, "#5ee6d8"], [108, "#ff7cc4"]]) {
    roundRect(x - 9, -98, 18, 14, 4); fillStroke(c, 3);
  }
  // ventanita del casete (entre los ojos)
  roundRect(-40, -74, 80, 36, 9); fillStroke("#efe4ff", 3.5);
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(s * 18, -56); ctx.rotate(t * 4 * st.glow);
    ellipse(0, 0, 9, 9); fillStroke("#7b4cc9", 2.5);
    for (let k = 0; k < 3; k++) { ctx.rotate(TAU / 3); ctx.fillStyle = "#efe4ff"; ctx.fillRect(-1.5, -7, 3, 5); }
    ctx.restore();
  }

  // altavoces = ojos
  const sp = 1 + st.pulse * .07;
  for (const s of [-1, 1]) {
    const ex = s * 74, ey = 0;
    ctx.save(); ctx.translate(ex, ey); ctx.scale(sp, sp);
    ellipse(0, 0, 54, 54); fillStroke("#4b2a7c", 4);
    ellipse(0, 0, 47, 47); ctx.lineWidth = 4; ctx.strokeStyle = "#cfaeff"; ctx.stroke();
    for (let a = 0; a < 16; a++) { // tornillitos del altavoz
      const aa = a * TAU / 16; ctx.fillStyle = "rgba(207,174,255,.6)"; ellipse(Math.cos(aa) * 50.5, Math.sin(aa) * 50.5, 1.4, 1.4); ctx.fill();
    }
    // globo ocular
    ellipse(0, 0, 40, 40); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.save(); ellipse(0, 0, 40, 40); ctx.clip();
    if (eyes > .05) {
      const px = look * 12 + s * -2, py = 4;
      ellipse(px, py, 19, 21); ctx.fillStyle = "#1d1026"; ctx.fill();
      ctx.fillStyle = "#fff"; ellipse(px - 6, py - 8, 7, 7); ctx.fill(); ellipse(px + 7, py + 8, 3, 3); ctx.fill();
    }
    // párpado
    const lidY = -40 + 80 * (1 - eyes);
    ctx.fillStyle = "#8a58d6"; ctx.fillRect(-45, -45, 90, lidY + 45);
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(-45, -45, 90, Math.max(0, lidY + 45) * .35);
    ctx.beginPath(); ctx.moveTo(-42, lidY); ctx.lineTo(42, lidY); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
    ellipse(0, 0, 40, 40); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
    if (eyes <= .05) { // ojos dormidos
      ctx.beginPath(); ctx.moveTo(-24, 4); ctx.quadraticCurveTo(0, 20, 24, 4); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    }
    ctx.restore();
  }

  // boca
  const m = st.mouth;
  if (m > .05) {
    const h = 14 + m * 22;
    ctx.beginPath(); ctx.moveTo(-34, 62); ctx.quadraticCurveTo(0, 70, 34, 62);
    ctx.quadraticCurveTo(30, 62 + h, 0, 64 + h); ctx.quadraticCurveTo(-30, 62 + h, -34, 62); ctx.closePath();
    fillStroke("#2a1238", 3.5);
    ctx.save(); ctx.clip(); ellipse(0, 66 + h, 20, 12); ctx.fillStyle = "#ff6f9e"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(-18, 60, 36, 7); ctx.restore();
  } else {
    ctx.beginPath(); ctx.moveTo(-20, 66); ctx.quadraticCurveTo(0, 76, 20, 66);
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  }
}

/* ---------- Luli (estilo anime, según la ilustración de referencia) ---------- */
const SKIN = "#ffe3d6", SKIN_SH = "#f6b9a8";
const HAIR = "#f7a6cc", HAIR_SH = "#df77ab", HAIR_HI = "#ffd9ec";
const GLOVE = "#ff6fb5", GOLD = "#ffd35c", GOLD_SH = "#d9982c";

function hairGradient(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#ee8dbd"); g.addColorStop(.4, HAIR); g.addColorStop(1, "#ffc7e1");
  return g;
}
function sparkleFill(r, x0, y0, w, h, n, t) {
  for (let i = 0; i < n; i++) {
    const x = x0 + r() * w, y = y0 + r() * h, tw = .5 + .5 * Math.sin(t * 7 + i * 1.7);
    ctx.fillStyle = `rgba(255,255,255,${.35 + .5 * tw})`; ellipse(x, y, 1.3 + tw, 1.3 + tw); ctx.fill();
  }
}

function cape(t, sw) {
  const w = Math.sin(t * 3) * 10 + sw * 12, w2 = Math.sin(t * 3 + 1) * 12 + sw * 12;
  ctx.beginPath();
  ctx.moveTo(-48, 104);
  ctx.bezierCurveTo(-130, 140, -170 + w, 260, -195 + w, 370);
  ctx.quadraticCurveTo(-150 + w, 352, -110 + w, 378);
  ctx.quadraticCurveTo(-50, 356, 0, 372);
  ctx.quadraticCurveTo(55, 356, 110 + w2, 378);
  ctx.quadraticCurveTo(150 + w2, 352, 195 + w2, 370);
  ctx.bezierCurveTo(170 + w2, 260, 130, 140, 48, 104);
  ctx.closePath();
  const g = ctx.createLinearGradient(-250, 0, 250, 0);
  g.addColorStop(0, "#f5b23a"); g.addColorStop(.5, "#ffe486"); g.addColorStop(1, "#f5b23a");
  fillStroke(g, 3.5);
  ctx.strokeStyle = "rgba(200,120,20,.45)"; ctx.lineWidth = 3;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 70, 130); ctx.quadraticCurveTo(s * 115, 250, s * (135 + (s < 0 ? w : w2)), 365); ctx.stroke();
  }
}

function braid(x0, y0, x1, y1, cx, cy, withBow, t) {
  const n = 12;
  for (let i = 0; i <= n; i++) {
    const k = i / n, a = 1 - k;
    const x = a * a * x0 + 2 * a * k * cx + k * k * x1, y = a * a * y0 + 2 * a * k * cy + k * k * y1;
    const dx = 2 * a * (cx - x0) + 2 * k * (x1 - cx), dy = 2 * a * (cy - y0) + 2 * k * (y1 - cy);
    const ang = Math.atan2(dy, dx), r = 20 - k * 8;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang + (i % 2 ? .35 : -.35));
    ellipse(0, 0, r * 1.05, r * .8);
    const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, HAIR_HI); g.addColorStop(1, HAIR_SH);
    fillStroke(g, 2.5); ctx.restore();
  }
  // punta y lazo
  ctx.save(); ctx.translate(x1, y1);
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-14, 40, 0, 62); ctx.quadraticCurveTo(12, 40, 10, 0); ctx.closePath();
  fillStroke(hairGradient(0, 60), 2.5);
  if (withBow) {
    ctx.rotate(Math.sin(t * 4) * .08);
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(s * 26, -26, s * 44, -6, s * 38, 12); ctx.bezierCurveTo(s * 30, 22, s * 12, 10, 0, 0);
      fillStroke("#ffd84d", 2.5);
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(s * 10, 24, s * 18, 40); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = 4; ctx.strokeStyle = "#ffd84d"; ctx.stroke();
    }
    ellipse(0, 1, 7, 7); fillStroke("#f5b23a", 2.5);
  }
  ctx.restore();
}

function backHair(sw) {
  ctx.beginPath();
  ctx.moveTo(-78, -20);
  ctx.bezierCurveTo(-106, 50, -104, 130, -122 + sw * 12, 210);

function torso(t, sw) {

  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-142 + sw * 6, 340); ctx.quadraticCurveTo(-70, 356, sw * 4, 350); ctx.quadraticCurveTo(70, 356, 142 + sw * 6, 340);
  ctx.lineWidth = 18; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 13; ctx.strokeStyle = GLOVE; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(0, 225); ctx.stroke();

function limb(pts, w, fill) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = w + 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = fill; ctx.stroke();
}
function gloveSparkle(a, b, t, seed) {
  const r = rng(seed);
  for (let i = 0; i < 9; i++) {
    const k = r(), x = lerp(a[0], b[0], k) + (r() - .5) * 12, y = lerp(a[1], b[1], k) + (r() - .5) * 12;
    ctx.fillStyle = `rgba(255,255,255,${.4 + .5 * Math.sin(t * 9 + i * 2)})`; ellipse(x, y, 1.8, 1.8); ctx.fill();
  }
}
function arms(t, s) {
  // brazo izquierdo (pantalla): mano abierta, palma hacia arriba
  const wv = Math.sin(t * 4) * 6;
  const Ls = [-56, 116], Le = [-104, 182], Lh = [-150, 150 + wv];
  limb([Ls, Le], 22, SKIN);
  limb([[lerp(Le[0], Ls[0], .15), lerp(Le[1], Ls[1], .15)], Lh], 25, GLOVE);
  gloveSparkle(Le, Lh, t, 11);
  ellipse(Le[0] + 2, Le[1] - 2, 16, 11, .6); fillStroke("#ffa6d3", 3);
  ctx.save(); ctx.translate(Lh[0], Lh[1]); ctx.rotate(-.5);
  ellipse(0, 0, 18, 13); fillStroke(GLOVE, 3);
  for (let i = 0; i < 4; i++) { ellipse(-20 + i * 2, -14 + i * 8, 11, 5, -.25 + i * .12); fillStroke(GLOVE, 2.5); }
  ellipse(6, -16, 5, 10, .5); fillStroke(GLOVE, 2.5);
  ctx.restore();

  // brazo derecho (pantalla): puño en alto que marca el ritmo
  const pump = s.beatPulse * 14;
  const Rs = [56, 116], Re = [118, 150], Rh = [104, 72 - pump];
  limb([Rs, Re], 22, SKIN);
  limb([[lerp(Re[0], Rs[0], .15), lerp(Re[1], Rs[1], .15)], Rh], 25, GLOVE);
  gloveSparkle(Re, Rh, t, 12);
  ellipse(Re[0] - 2, Re[1] + 2, 16, 11, -.9); fillStroke("#ffa6d3", 3);
  ctx.save(); ctx.translate(Rh[0], Rh[1]);
  roundRect(-17, -18, 34, 32, 11); fillStroke(GLOVE, 3);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const x of [-6, 4]) { ctx.beginPath(); ctx.moveTo(x, -17); ctx.lineTo(x, -6); ctx.stroke(); }
  ellipse(-14, 2, 6, 9, .3); fillStroke(GLOVE, 2);
  ctx.restore();
}

function face() {
  ctx.beginPath();

  ctx.bezierCurveTo(-60, 30, -24, 68, 0, 78);
  ctx.bezierCurveTo(24, 68, 60, 30, 60, -12);
  ctx.bezierCurveTo(60, -84, -60, -84, -60, -12);
  ctx.closePath();

  ctx.fillStyle = "rgba(240,150,150,.45)";
  ctx.beginPath(); ctx.moveTo(-70, -10);

function eye(x, side, open, t, wink) {
  ctx.save(); ctx.translate(x, 22); ctx.scale(.84, .84);
  ctx.strokeStyle = INK; ctx.lineCap = "round";
  if (wink) {
    ctx.beginPath(); ctx.moveTo(-22, 6); ctx.quadraticCurveTo(0, -16, 22, 6); ctx.lineWidth = 5.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(side * 20, 2); ctx.lineTo(side * 32, -8); ctx.lineWidth = 3.5; ctx.stroke();
    ctx.restore(); return;
  }
  if (open < .12) {
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.quadraticCurveTo(0, 12, 22, 2); ctx.lineWidth = 5; ctx.stroke();
    ctx.restore(); return;

  ctx.beginPath(); ctx.moveTo(-23, -6); ctx.bezierCurveTo(-22, -26, 22, -30, 24, -8);
  ctx.bezierCurveTo(24, 16, 12, 24, 0, 24); ctx.bezierCurveTo(-14, 24, -24, 14, -23, -6); ctx.closePath();
  ctx.fillStyle = "#fff"; ctx.fill();

  const ig = ctx.createLinearGradient(0, -20, 0, 26);
  ig.addColorStop(0, "#4a1240"); ig.addColorStop(.45, "#c2338a"); ig.addColorStop(1, "#ffa8da");
  ctx.fillStyle = ig; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#3a0c30"; ctx.stroke();
  ellipse(side * 1.5, 15, 11, 6); ctx.fillStyle = "rgba(255,200,235,.7)"; ctx.fill();
  ellipse(side * 1.5, 4, 7, 10); ctx.fillStyle = "#2a0620"; ctx.fill();
  ctx.fillStyle = "rgba(90,30,70,.3)"; ctx.fillRect(-30, -30, 60, 13);
  ctx.fillStyle = "#fff";
  ellipse(-side * 5 + 2, -6, 6.5, 8.5, -.3); ctx.fill();
  ellipse(side * 8, 13, 3, 3); ctx.fill();
  star4(side * 7, -10, 5 + Math.sin(t * 6) * 1.5, t, "#fff");
  ctx.restore();
  // pestañas con "ala"
  ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(-side * 24, -2); ctx.bezierCurveTo(-side * 22, -28, side * 20, -34, side * 30, -10);
  ctx.lineWidth = 7; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(side * 26, -14); ctx.quadraticCurveTo(side * 34, -16, side * 40, -24); ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(side * 28, -8); ctx.quadraticCurveTo(side * 36, -8, side * 40, -12); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 25); ctx.quadraticCurveTo(6, 27, 16, 21); ctx.lineWidth = 2; ctx.stroke();

function mouth(open) {

function bangs(sw) {
  // flequillo peinado de lado (raya a la derecha de la pantalla)
  ctx.beginPath();
  ctx.moveTo(-84, 30);

  let px = 84, py = 30;
  for (const [x, y] of pts) {

    ctx.quadraticCurveTo(down ? px * .25 + xx * .75 : px * .75 + xx * .25, down ? py * .8 + y * .2 : py * .2 + y * .8, xx, y);

    ctx.bezierCurveTo(s * 108, 60, s * 96 + sw * 8, 140, s * 104 + sw * 10, 196);
    ctx.quadraticCurveTo(s * 84 + sw * 8, 150, s * 76, 80);

  }

function starClip(t) {
  ctx.save(); ctx.translate(64, -58); ctx.rotate(.3 + Math.sin(t * 3) * .05);
  star5(0, 0, 15, 0); fillStroke("#ffe14d", 3);

}

function luli(t, s) {
  // s: { sway, bob, blink, mouth, wink, beatPulse, tilt }
  ctx.save();
  ctx.translate(0, -s.bob);
  cape(t, s.sway);
  braid(-70, 60, -118 + s.sway * 16, 300, -120, 170, false, t);
  braid(70, 60, 126 + s.sway * 16, 290, 124, 170, true, t);
  backHair(s.sway);
  // piernas (asoman bajo la falda)
  for (const x of [-38, 38]) {
    ctx.beginPath(); ctx.moveTo(x - 22, 330); ctx.lineTo(x + 22, 330); ctx.lineTo(x + 15, 420); ctx.lineTo(x - 15, 420); ctx.closePath(); fillStroke(SKIN, 3);
    roundRect(x - 19, 400, 38, 60, 12); fillStroke("#ffb3d9", 3);
  }
  torso(t, s.sway);
  ctx.save(); ctx.translate(0, 20); ctx.rotate(s.tilt); ctx.translate(0, -20);
  face();
  for (const side of [-1, 1]) {
    const bg = ctx.createRadialGradient(side * 40, 46, 1, side * 40, 46, 18);
    bg.addColorStop(0, "rgba(255,110,160,.55)"); bg.addColorStop(1, "rgba(255,110,160,0)");
    ctx.fillStyle = bg; ellipse(side * 40, 46, 20, 12); ctx.fill();
  }

  eye(30, 1, s.blink, t, s.wink);
  ctx.beginPath(); ctx.moveTo(2, 40); ctx.lineTo(-1, 44); ctx.lineWidth = 2; ctx.strokeStyle = "#d98c78"; ctx.lineCap = "round"; ctx.stroke();
  mouth(s.mouth);
  bangs(s.sway);
  starClip(t);
  ctx.restore();
  arms(t, s);
  ctx.restore();
}

/* ---------- título ---------- */
function title(t) {
  const k = seg(t, 8.0, 8.6);
  if (k <= 0) return;
  const sc = easeBack(k);
  ctx.save(); ctx.translate(W / 2, 590); ctx.scale(sc, sc);
  // cinta
  ctx.beginPath(); ctx.moveTo(-430, -62); ctx.quadraticCurveTo(0, -92, 430, -62);
  ctx.lineTo(450, 70); ctx.quadraticCurveTo(0, 40, -450, 70); ctx.closePath();
  const rg = ctx.createLinearGradient(-450, 0, 450, 0);
  rg.addColorStop(0, "#7a3cff"); rg.addColorStop(.5, "#ff4f9a"); rg.addColorStop(1, "#ff9b54");
  ctx.globalAlpha = .92; fillStroke(rg, 5, "#2a0f3a"); ctx.globalAlpha = 1;

  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const lines = [["Luli Pampín", `bold 64px ${FONT}`, -18], ["y la Radio Mágica", `bold 34px ${FONT}`, 38]];
  for (const [txt, f, y] of lines) {
    ctx.font = f;
    ctx.lineWidth = 12; ctx.strokeStyle = "#2a0f3a"; ctx.strokeText(txt, 0, y);
    const tg = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    tg.addColorStop(0, "#fffbe0"); tg.addColorStop(.55, "#ffe14d"); tg.addColorStop(1, "#ffb13d");
    ctx.fillStyle = tg; ctx.fillText(txt, 0, y);
  }
  // barrido de brillo
  const sh = seg(t, 8.7, 9.5);
  if (sh > 0 && sh < 1) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-430, -62); ctx.quadraticCurveTo(0, -92, 430, -62);
    ctx.lineTo(450, 70); ctx.quadraticCurveTo(0, 40, -450, 70); ctx.closePath(); ctx.clip();
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .45;
    const x = lerp(-420, 420, sh);
    const shg = ctx.createLinearGradient(x - 60, 0, x + 60, 0);
    shg.addColorStop(0, "rgba(255,255,255,0)"); shg.addColorStop(.5, "rgba(255,255,255,.9)"); shg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = shg; ctx.fillRect(-450, -90, 900, 170);
    ctx.restore();
  }
  star4(-400 + Math.sin(t * 4) * 6, -70, 22 * (0.7 + .3 * Math.sin(t * 7)), t, "#fff");
  star4(410, 40, 18 * (0.7 + .3 * Math.cos(t * 6)), -t, "#fff");
  ctx.restore();
}

/* ---------- escena completa ---------- */
function zzz(x, y, t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (let i = 0; i < 3; i++) {
    const k = ((t * .6 + i / 3) % 1);
    ctx.globalAlpha = alpha * Math.sin(k * Math.PI);
    ctx.font = `bold ${22 + k * 26}px ${FONT}`;
    const zx = x + k * 70 + Math.sin(k * 6) * 8, zy = y - k * 110;
    ctx.lineWidth = 6; ctx.strokeStyle = "#3a1b5a"; ctx.strokeText("Z", zx, zy);
    ctx.fillStyle = "#e9dcff"; ctx.fillText("Z", zx, zy);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over";

  const beatPhase = (t / BEAT) % 1;
  const beatPulse = Math.pow(1 - beatPhase, 3);
  const magic = easeInOut(seg(t, 1.6, 4.2));
  const shake = seg(t, 2.8, 3.55) * (1 - seg(t, 3.55, 3.7));
  const sx = shake ? Math.sin(t * 90) * 6 * shake : 0, sy = shake ? Math.cos(t * 77) * 5 * shake : 0;

  const zoom = t < 3.6 ? lerp(1.0, 1.15, easeInOut(seg(t, 0, 3.5)))
             : t < 8 ? lerp(1.12, 1.0, easeOut(seg(t, 3.6, 5))) + .04 * easeInOut(seg(t, 5, 8))
             : lerp(1.04, .96, easeInOut(seg(t, 8, 10)));
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);

  drawSky(t, magic);
  sunburst(W / 2, 330, t, .55 * easeOut(seg(t, 3.6, 4.6)));
  drawClouds(t, magic);

  if (t < 3.62) {
    // escena 1: la Radio duerme sobre una nube... ¡y se despierta!
    const rx = W / 2, ry = 400 + Math.sin(t * 2) * 6;
    const wake = seg(t, 1.25, 1.45);                       // abre los ojos de golpe
    const power = easeOut(seg(t, 1.7, 2.4));
    const surprise = Math.sin(seg(t, 1.25, 1.75) * Math.PI);  // estirón de sorpresa
    const pg = ctx.createRadialGradient(rx, ry + 110, 10, rx, ry + 110, 260);
    pg.addColorStop(0, `rgba(255,200,240,${.2 + .5 * power})`); pg.addColorStop(1, "rgba(255,200,240,0)");
    ctx.fillStyle = pg; ctx.fillRect(rx - 300, ry - 100, 600, 420);
    cloud(rx - 10, ry + 150, 1.5, mixHex("#5a3a9c", "#ffd6ee", power));
    soundRings(rx, ry, t, 1.9, power);
    speedLines(rx, ry, t, seg(t, 2.7, 3.5) * .85);
    particles(rx, ry - 20, t, 3.4);
    ctx.save(); ctx.translate(rx, ry + 120);
    const bounce = power * beatPulse * .05;
    ctx.scale(1.25 * (1 - surprise * .06 + bounce), 1.25 * (1 + surprise * .1 - bounce));
    ctx.rotate(Math.sin(t * 1.6) * .03 * (1 - power) + shake * Math.sin(t * 60) * .04);
    ctx.translate(0, -120);
    const lookX = t < 1.9 ? Math.sin(seg(t, 1.45, 1.9) * TAU) : 0;
    const sing = t > 1.9 ? (Math.sin(t * TAU * 2.1) * .5 + .5) : (t > 1.45 ? .15 : 0);
    radioChar(t, { eyes: wake, mouth: sing, look: lookX, pulse: beatPulse * power, glow: power });
    ctx.restore();
    zzz(rx + 150, ry - 90, t, 1 - seg(t, 1.1, 1.3));
    if (t > 1.25 && t < 1.8) { // "!" de sorpresa
      const k = seg(t, 1.25, 1.8), s = easeBack(seg(t, 1.25, 1.4)) * (1 - seg(k, .7, 1));
      ctx.save(); ctx.translate(rx + 170, ry - 150); ctx.scale(s, s);
      ctx.font = `bold 70px ${FONT}`; ctx.textAlign = "center"; ctx.lineJoin = "round";
      ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.strokeText("!", 0, 0); ctx.fillStyle = "#ffe14d"; ctx.fillText("!", 0, 0);
      ctx.restore();
    }
  } else {
    // escena 2: ¡aparece Luli y canta con la Radio!
    const cx = 520, cy = 205;
    const pop = easeBack(seg(t, 3.6, 4.15));
    const danceT = t - 3.6;
    const sway = Math.sin(danceT * Math.PI / BEAT / 2) * clamp(danceT * 2);
    const bob = Math.abs(Math.sin(danceT * Math.PI / BEAT)) * 10;
    const blinkT = [5.3, 6.55, 9.2].reduce((m, b) => Math.min(m, Math.abs(t - b)), 9);
    const blink = blinkT < .09 ? blinkT / .09 : 1;
    const wink = t > 7.35 && t < 7.95;
    const singing = t > 4.3 && t < 8.1 ? (Math.sin(t * TAU * 2.1) * .5 + .5) * (Math.sin(t * 5.1) > -.4 ? 1 : 0) : (t >= 8.1 ? .9 : 0);

    // la Radio a la derecha, saltando al ritmo
    const rPop = easeBack(seg(t, 3.75, 4.3));
    const rx = 930, ry = 520;
    const hop = Math.abs(Math.sin(danceT * Math.PI / BEAT)) * 26;
    const squash = beatPulse * .08;
    soundRings(rx, ry - 20, t, 3.6, 1);
    particles(rx, ry - 60, t, 9.5);
    ctx.save(); ctx.translate(rx, ry + 130 - hop);
    ctx.scale(rPop * (1 + squash), rPop * (1 - squash)); ctx.rotate(-sway * .06);
    ctx.translate(0, -124);
    const rSing = t > 4.2 ? (Math.sin(t * TAU * 2.1 + 1.2) * .5 + .5) : .3;
    radioChar(t, { eyes: blinkT < .09 ? .1 : 1, mouth: rSing, look: -.5 + sway * .3, pulse: beatPulse, glow: 1 });
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy + (1 - pop) * 80);
    ctx.scale(1.12 * pop, 1.12 * pop);
    ctx.rotate(sway * .04);
    luli(t, { sway, bob, blink, mouth: singing, wink, beatPulse, tilt: sway * .06 });
    ctx.restore();

    if (wink) {
      const wk = seg(t, 7.35, 7.95), s = Math.sin(wk * Math.PI);
      const wx = cx + 70 * 1.12, wy = cy + 10;
      star4(wx, wy - 10, 40 * s, wk * 3, "#fff6a8");
      star4(wx + 36, wy - 44, 18 * s, -wk * 4, "#fff");
      heart(wx + 50, wy + 10, 14 * s); ctx.fillStyle = "#ff5fa2"; ctx.fill();
    }

    for (const sp of SPARKS) {
      const a = sp.a + t * .4, tw = Math.sin(t * 5 + sp.p);
      if (tw < 0) continue;
      star4(W / 2 + Math.cos(a) * sp.d * 1.3, 330 + Math.sin(a) * sp.d * .9, sp.s * tw * seg(t, 3.8, 4.6), t, "#fff");
    }
  }

  if (t > 8.0) {
    for (const c of CONFETTI) {
      const age = t - 8.0 - c.d; if (age < 0) continue;
      const x = c.x + c.vx * age + Math.sin(age * 3 + c.r) * 20, y = -20 + c.vy * age;
      ctx.save(); ctx.translate(x, y); ctx.rotate(c.r + c.vr * age); ctx.scale(1, Math.cos(age * 6 + c.r));
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }
  }
  title(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(10,0,30,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const flash = t < 3.62 ? seg(t, 3.3, 3.62) : 1 - seg(t, 3.62, 4.1);
  if (flash > 0) { ctx.fillStyle = `rgba(255,248,235,${easeInOut(flash)})`; ctx.fillRect(0, 0, W, H); }
  const fade = Math.max(1 - seg(t, 0, .8), seg(t, 9.6, 10));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 18); ctx.fillRect(0, H - 18, W, 18);
}

/* ---------- reproducción ---------- */
window.renderAt = t => render(clamp(t, 0, DURATION - 1e-4));
let start = null, playing = false;
function loop(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000;
  render(Math.min(t, DURATION - 1e-4));
  if (t < DURATION) requestAnimationFrame(loop); else playing = false;
}
const music = new Audio("musica.wav");
function play() {
  if (playing) return; playing = true; start = null;
  try { music.currentTime = 0; music.play().catch(() => {}); } catch (e) {}
  requestAnimationFrame(loop);
}
document.getElementById("replay").addEventListener("click", play);
if (new URLSearchParams(location.search).has("capture")) { document.body.classList.add("capture"); render(0); }
else play();
</script>
